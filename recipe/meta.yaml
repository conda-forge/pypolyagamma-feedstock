{% set name = "pypolyagamma" %}
{% set version = "1.2.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/slinderman/pypolyagamma/archive/{{ version }}.tar.gz
  sha256: c98828ad630586c516a4e69698914d1132682eb39d48822fd804b7163eecee83

build:
  number: 6
  skip: True  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - numpy
    - cython
    - llvm-openmp  # [osx]
    - setuptools
    - gsl  # [linux]
  run:
    - python
    - scipy
    - llvm-openmp  # [osx]
    
test:
  imports:
    - pypolyagamma

about:
  home: https://github.com/slinderman/pypolyagamma
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: A port of Jesse Windles PolyaGamma sampling code using Cython.

extra:
  recipe-maintainers:
    - slinderman
    - beckermr
